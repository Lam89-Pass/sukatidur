    <script type="text/javascript">
        // Fancybox (lihat sertifikat)
        document.addEventListener('DOMContentLoaded', function () {
            if (window.Fancybox) { Fancybox.bind("[data-fancybox]", {}); }
        });

        /* =====================================================
           NAVBAR: smooth scroll + penanda menu aktif (scrollspy)
           Mandiri, tidak tergantung script bawaan tema.
           ===================================================== */
        (function () {
            var ORDER = ['home_sec', 'section_about', 'section_expertise',
                'section_experiences', 'section_education',
                'section_certifications', 'section_contact'];

            function headerHeight() {
                var h = document.querySelector('.header--sticky');
                return h ? h.offsetHeight : 80;
            }

            function scrollToId(id) {
                var el = document.getElementById(id);
                if (!el) return false;
                var y = id === 'home_sec'
                    ? 0
                    : el.getBoundingClientRect().top + window.pageYOffset - headerHeight() + 1;
                window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
                return true;
            }

            // Klik menu (fase capture: mengalahkan handler bawaan tema)
            document.addEventListener('click', function (e) {
                var a = e.target.closest ? e.target.closest('a[href^="#"]') : null;
                if (!a) return;
                var href = a.getAttribute('href');
                if (!href || href.length < 2) return;
                var id = href.slice(1);
                if (!document.getElementById(id)) return;

                e.preventDefault();
                e.stopImmediatePropagation();

                // tutup menu mobile bila terbuka
                var popup = document.querySelector('.tmp-popup-mobile-menu');
                if (popup) popup.classList.remove('active');
                var overlay = document.querySelector('.tmp-sidebar-area.tmp_side_bar');
                if (overlay) overlay.classList.remove('active');

                scrollToId(id);
                if (history.pushState) history.pushState(null, '', '#' + id);
            }, true);

            // Scrollspy
            var links = [].slice.call(document.querySelectorAll(
                '.alam-menu a[href^="#"], .tmp-popup-mobile-menu .tmp-mainmenu a[href^="#"]'));
            var ticking = false;

            function updateActive() {
                ticking = false;
                var current = ORDER[0];
                var probe = window.pageYOffset + headerHeight() + 40;
                ORDER.forEach(function (id) {
                    var el = document.getElementById(id);
                    if (el && el.getBoundingClientRect().top + window.pageYOffset <= probe) current = id;
                });
                // mentok di bawah halaman -> menu terakhir
                if (window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4) {
                    current = ORDER[ORDER.length - 1];
                }
                links.forEach(function (l) {
                    l.classList.toggle('is-active', l.getAttribute('href') === '#' + current);
                });
            }

            window.addEventListener('scroll', function () {
                if (!ticking) { ticking = true; requestAnimationFrame(updateActive); }
            }, { passive: true });
            window.addEventListener('resize', updateActive);
            window.addEventListener('load', function () {
                updateActive();
                if (location.hash.length > 1) setTimeout(function () { scrollToId(location.hash.slice(1)); }, 300);
            });
            updateActive();
        })();
    </script>
