<style>
    .ph {
        --u: clamp(.8px, calc(100vw / 1672), 1.9px);
        --ph-text: #e8edf7;
        --ph-accent: #2f6bff;
        --ph-circle-bg: rgba(255, 255, 255, 0.04);
        --ph-circle-border: rgba(255, 255, 255, 0.16);
        --ph-scrolled-bg: rgba(6, 11, 22, 0.8);
        --ph-line: rgba(120, 160, 255, 0.14);
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        border-bottom: 1px solid transparent;
        transition: background .3s ease, border-color .3s ease;
        animation: phDown .8s cubic-bezier(.2, .8, .2, 1) both;
    }

    .ph.is-scrolled {
        background: var(--ph-scrolled-bg);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-color: var(--ph-line);
    }

    .ph *,
    .ph *::before,
    .ph *::after {
        box-sizing: border-box;
    }

    @keyframes phDown {
        from {
            opacity: 0;
            translate: 0 -30px;
        }

        to {
            opacity: 1;
            translate: 0 0;
        }
    }

    .ph-inner {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        height: calc(96 * var(--u));
        padding: 0 3.5vw 0 7.2vw;
    }

    .ph-brand {
        display: inline-flex;
        align-items: center;
        gap: calc(14 * var(--u));
        text-decoration: none;
        color: var(--ph-text);
        justify-self: start;
    }

    .ph-brand svg {
        width: calc(44 * var(--u));
        height: calc(40 * var(--u));
        display: block;
        transition: transform .4s cubic-bezier(.3, 1.6, .5, 1);
    }

    .ph-brand:hover svg {
        transform: rotate(-8deg) scale(1.1);
    }

    .ph-brand-text {
        font-size: calc(28 * var(--u));
        font-weight: 800;
        letter-spacing: .01em;
        line-height: 1;
    }

    .ph-brand-text b {
        color: var(--ph-accent);
        font-weight: 800;
    }

    .ph-nav {
        position: relative;
        display: flex;
        align-items: center;
        gap: 2.3vw;
    }

    .ph-nav a {
        color: var(--ph-text);
        text-decoration: none;
        font-size: calc(17 * var(--u));
        font-weight: 500;
        padding: 6px 0;
        white-space: nowrap;
        transition: color .2s ease;
    }

    .ph-nav a:hover,
    .ph-nav a.is-active {
        color: var(--ph-accent);
    }

    .ph-nav a.is-active {
        font-weight: 600;
    }

    .ph-ind {
        position: absolute;
        left: 0;
        bottom: calc(-12 * var(--u));
        height: 3px;
        width: 0;
        border-radius: 3px;
        background: var(--ph-accent);
        box-shadow: 0 0 12px rgba(47, 107, 255, .8);
        transition: transform .35s cubic-bezier(.3, 1, .4, 1), width .35s cubic-bezier(.3, 1, .4, 1);
        pointer-events: none;
    }

    .ph-actions {
        display: flex;
        align-items: center;
        gap: calc(14 * var(--u));
        justify-self: end;
    }

    .ph-circle {
        width: calc(48 * var(--u));
        height: calc(48 * var(--u));
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: 1px solid var(--ph-circle-border);
        background: var(--ph-circle-bg);
        color: var(--ph-text);
        font-size: calc(18 * var(--u));
        text-decoration: none;
        cursor: pointer;
        transition: border-color .25s ease, background .25s ease, transform .25s cubic-bezier(.3, 1.6, .5, 1), box-shadow .25s ease;
    }

    .ph-circle:hover {
        border-color: var(--ph-accent);
        background: rgba(47, 107, 255, .2);
        box-shadow: 0 0 18px rgba(47, 107, 255, .45);
        transform: translateY(-3px) scale(1.06);
    }

    .ph-circle:focus-visible,
    .ph-nav a:focus-visible,
    .ph-brand:focus-visible {
        outline: 2px solid var(--ph-accent);
        outline-offset: 3px;
    }

    .ph-burger {
        display: none;
    }

    .ph-mobile {
        display: none;
        padding: 8px 6vw 24px;
        background: var(--ph-scrolled-bg);
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        border-top: 1px solid var(--ph-line);
    }

    .ph-mobile.is-open {
        display: block;
        animation: phDown .35s ease both;
    }

    .ph-mobile a.ph-link {
        display: block;
        padding: 14px 0;
        color: var(--ph-text);
        text-decoration: none;
        font-weight: 500;
        border-bottom: 1px solid var(--ph-line);
    }

    .ph-mobile a.ph-link.is-active {
        color: var(--ph-accent);
        font-weight: 700;
    }

    .ph-mobile .ph-actions {
        margin-top: 18px;
        justify-self: start;
        flex-wrap: wrap;
    }

    @media (max-width: 1100px) {
        .ph {
            --u: .9px;
        }

        .ph-inner {
            grid-template-columns: 1fr auto;
            height: 72px;
            padding: 0 6vw;
        }

        .ph-nav,
        .ph-actions .ph-hide-sm {
            display: none;
        }

        .ph-burger {
            display: inline-flex;
        }
    }

    @media (prefers-reduced-motion: reduce) {

        .ph,
        .ph-mobile.is-open {
            animation: none;
        }

        .ph *,
        .ph-ind {
            transition: none !important;
        }
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var header = document.getElementById("siteHeader");
        var burger = document.getElementById("phBurger");
        var mobile = document.getElementById("phMobile");
        var nav = document.getElementById("phNav");
        var ind = document.getElementById("phInd");

        function onScroll() { header.classList.toggle("is-scrolled", window.scrollY > 20); }
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });

        function setBurger(open) {
            mobile.classList.toggle("is-open", open);
            burger.setAttribute("aria-expanded", open ? "true" : "false");
            burger.firstElementChild.className = open ? "fa-solid fa-xmark" : "fa-solid fa-bars";
        }
        burger.addEventListener("click", function () { setBurger(!mobile.classList.contains("is-open")); });
        mobile.querySelectorAll("a.ph-link").forEach(function (a) {
            a.addEventListener("click", function () { setBurger(false); });
        });

        var navLinks = Array.prototype.slice.call(nav.querySelectorAll("a"));
        function moveInd(a) {
            if (!a || !a.offsetWidth) return;
            ind.style.width = a.offsetWidth + "px";
            ind.style.transform = "translateX(" + a.offsetLeft + "px)";
        }
        function current() { return nav.querySelector("a.is-active") || navLinks[0]; }
        navLinks.forEach(function (a) {
            a.addEventListener("mouseenter", function () { moveInd(a); });
            a.addEventListener("focus", function () { moveInd(a); });
        });
        nav.addEventListener("mouseleave", function () { moveInd(current()); });
        window.addEventListener("resize", function () { moveInd(current()); });
        (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () { moveInd(current()); });
        moveInd(current());

        var links = navLinks.concat(Array.prototype.slice.call(mobile.querySelectorAll("a.ph-link")));
        var map = {};
        links.forEach(function (a) {
            var id = a.getAttribute("href").slice(1);
            if (document.getElementById(id)) { (map[id] = map[id] || []).push(a); }
        });
        var ids = Object.keys(map);
        if ("IntersectionObserver" in window && ids.length) {
            var io = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                    if (!en.isIntersecting) return;
                    links.forEach(function (l) { l.classList.remove("is-active"); });
                    (map[en.target.id] || []).forEach(function (l) { l.classList.add("is-active"); });
                    moveInd(current());
                });
            }, { rootMargin: "-45% 0px -50% 0px" });
            ids.forEach(function (id) { io.observe(document.getElementById(id)); });
        }
    });
</script>
