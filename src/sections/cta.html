<!-- =====================================================
  src/sections/cta.html
  Kontak (simpel): email besar + CV + GitHub, dan form kirim pesan
  Gaya  : assets/css/lower-sections.css (bagian "KONTAK")
  Skrip : assets/js/lower-sections.js (salin, form, jam Bandung)
  Form membuka WhatsApp dengan pesan yang sudah tersusun.
  Nomor WhatsApp form diatur di lower-sections.js (WA_NUMBER).
===================================================== -->
<section class="ct" id="contact">
    <div class="ct-wrap">
        <h2 class="ct-title" data-rv>Kontak</h2>

        <div class="ct-grid">
            <div data-rv>
                <p class="ct-lead">Ada peluang magang, kerja, atau proyek yang ingin dibahas? Kirim email atau tulis
                    pesan lewat form.</p>

                <div class="ct-mail">
                    <a class="ct-addr" href="mailto:aaallaaamm03@gmail.com">aaallaaamm03@gmail.com</a>
                    <button class="ct-copy" type="button" data-copy="aaallaaamm03@gmail.com"
                        aria-label="Salin alamat email"><i class="fa-regular fa-copy"></i><span
                            class="ct-copy-t">Salin</span></button>
                </div>

                <div class="ct-actions">
                    <a class="ct-btn ct-btn--line" href="cv-muhamad-nur-salam.pdf" download><i
                            class="fa-solid fa-file-arrow-down"></i>Unduh CV</a>
                    <a class="ct-circle" href="https://github.com/Lam89-Pass" target="_blank" rel="noopener"
                        aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                </div>

                <p class="ct-meta">
                    <span><i class="fa-solid fa-location-dot"></i>Dago, Kota Bandung</span>
                    <span><i class="fa-regular fa-clock"></i><span id="ctTime">WIB</span></span>
                </p>
            </div>

            <form class="ct-form" id="ctForm" data-rv novalidate>
                <h3 class="ct-form-t">Kirim pesan</h3>

                <label for="ctNama">Nama atau perusahaan</label>
                <input type="text" id="ctNama" name="nama" autocomplete="name" placeholder="Nama Anda">

                <label for="ctPesan">Pesan</label>
                <textarea id="ctPesan" name="pesan" placeholder="Tulis pesan Anda"></textarea>

                <button class="ct-btn" type="submit"><i class="fa-brands fa-whatsapp"></i>Kirim lewat WhatsApp</button>
                <p class="ct-hint" id="ctHint" role="alert"></p>
            </form>
        </div>
    </div>
</section>
